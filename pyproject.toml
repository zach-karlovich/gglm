[project]
name = "gglm"
version = "0.1.0"
description = "Gas Gun Language Model: RAG assistant for LGG/HVI literature"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.1",
    "pymupdf>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gglm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
